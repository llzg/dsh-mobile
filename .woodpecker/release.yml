# dsh-mobile release/CD pipeline — event: deployment ONLY (explicit human deploy = approval gate)
# Woodpecker 3.17.0 has NO workflow-level approval. The native explicit gate is the
# DEPLOYMENT event: a human deploys a specific verified pipeline (UI "deploy" action or
# POST /api/repos/{id}/pipelines/{n}?event=deployment&deploy_to=<env>).
# manual / cron / push / pull_request NEVER run release (NATIVE_APPROVAL_UNAVAILABLE,
# FALLBACK_GATE=deployment-event).
# Produces: signed release APK (if keystore secrets) + latest.apk + deploy-status.json
# + Gitea release asset (if GITEA_TOKEN secret present). Healthcheck via download URL.
when:
  event: [deployment]
  branch: main

clone:
  git:
    image: docker.io/woodpeckerci/plugin-git:2.9.2
    settings:
      # clone from the Gitea LAN mirror (secret-injected URL, no leak into git)
      url:
        from_secret: GITEA_CLONE_URL

steps:
  deploy-context:
    image: alpine:3.20
    commands:
      - echo "deployment pipeline repo=$CI_REPO sha=$CI_COMMIT_SHA branch=$CI_COMMIT_BRANCH"
      - echo "deploy_target=${CI_PIPELINE_DEPLOY_TARGET:-none} event=$CI_BUILD_EVENT"

  release-check:
    image: alpine:3.20
    commands:
      - echo "release pipeline repo=$CI_REPO sha=$CI_COMMIT_SHA branch=$CI_COMMIT_BRANCH"
      - if [ -n "$GITEA_TOKEN" ]; then GT=SET; else GT=missing; fi; if [ -n "$DSH_KEYSTORE" ]; then KS=SET; else KS=missing; fi; echo "secrets GITEA_TOKEN=$GT KEYSTORE=$KS"

  setup-android-sdk:
    image: eclipse-temurin:17-jdk
    environment:
      HTTP_PROXY: http://192.168.5.36:7893
      HTTPS_PROXY: http://192.168.5.36:7893
      NO_PROXY: localhost,127.0.0.1,192.168.5.0/24
      ANDROID_HOME: /opt/android-sdk
      ANDROID_SDK_ROOT: /opt/android-sdk
    volumes:
      - /volume1/docker/dsh-mobile/ci-cache/android-sdk:/opt/android-sdk
    commands:
      - sh scripts/ci/setup-android-sdk.sh

  assemble-release:
    image: eclipse-temurin:17-jdk
    environment:
      HTTP_PROXY: http://192.168.5.36:7893
      HTTPS_PROXY: http://192.168.5.36:7893
      NO_PROXY: localhost,127.0.0.1,192.168.5.0/24
      ANDROID_HOME: /opt/android-sdk
      ANDROID_SDK_ROOT: /opt/android-sdk
      GRADLE_USER_HOME: /root/.gradle
      JAVA_TOOL_OPTIONS: "-Dhttp.proxyHost=192.168.5.36 -Dhttp.proxyPort=7893 -Dhttps.proxyHost=192.168.5.36 -Dhttps.proxyPort=7893 -Dhttp.nonProxyHosts=192.168.5.*|127.0.0.1|localhost"
      DSH_KEYSTORE:
        from_secret: DSH_KEYSTORE
      DSH_KEYSTORE_PASSWORD:
        from_secret: DSH_KEYSTORE_PASSWORD
      DSH_KEY_ALIAS:
        from_secret: DSH_KEY_ALIAS
      DSH_KEY_PASSWORD:
        from_secret: DSH_KEY_PASSWORD
    volumes:
      - /volume1/docker/dsh-mobile/ci-cache/android-sdk:/opt/android-sdk
      - /volume1/docker/dsh-mobile/ci-cache/gradle:/root/.gradle
    commands:
      - export DSH_BUILD_REVISION="$CI_COMMIT_SHA"
      - ./gradlew --no-daemon :app:assembleRelease --stacktrace
      - ls -la app/build/outputs/apk/release/

  publish-cd:
    image: alpine:3.20
    environment:
      GITEA_TOKEN:
        from_secret: GITEA_TOKEN
      GITEA_URL: http://192.168.5.35:3000
    volumes:
      - /volume1:/volume1
    commands:
      - apk add --no-cache curl jq >/dev/null 2>&1
      - sh scripts/ci/cd-publish.sh

