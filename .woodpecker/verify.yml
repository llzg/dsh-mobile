# dsh-mobile verify pipeline — local Woodpecker CI (DXP6800 agent)
# Trigger: push / pull_request / manual (via ci-trigger.sh) — cron runs mirror-sync ONLY (flood governance)
# Artifact store: /volume1/docker/dsh-mobile/releases (NAS), build-info-<sha7>.json (real CI data)
when:
  event: [push, pull_request, manual]

clone:
  git:
    image: docker.io/woodpeckerci/plugin-git:2.9.2
    settings:
      # clone from the Gitea LAN mirror (secret-injected URL, no leak into git)
      url:
        from_secret: GITEA_CLONE_URL

steps:
  env-check:
    image: alpine:3.20
    commands:
      - echo "repo=$CI_REPO sha=$CI_COMMIT_SHA branch=$CI_COMMIT_BRANCH event=$CI_BUILD_EVENT"
      - uname -m

  # Trigger governance (platform): idempotency via Woodpecker API (repo+commit+pipeline),
  # flock lock, queue flood guard, disk guard. Same SHA → SKIP (no re-build, no re-trigger).
  idempotency-check:
    image: alpine:3.20
    environment:
      WOODPECKER_URL: http://192.168.5.16:8010
      WOODPECKER_TOKEN:
        from_secret: WOODPECKER_TOKEN
    volumes:
      - /volume1:/volume1
    commands:
      - apk add --no-cache util-linux curl >/dev/null 2>&1 || true
      - mkdir -p /volume1/docker/dsh-mobile/ci-cache/guard
      - sh scripts/ci/ci-trigger-guard.sh --pipeline-name auto-verify --lockfile /volume1/docker/dsh-mobile/ci-cache/guard/trigger.lock --in-pipeline
      - echo "guard-done"

  setup-java:
    image: eclipse-temurin:17-jdk
    environment:
      HTTP_PROXY: http://192.168.5.36:7893
      HTTPS_PROXY: http://192.168.5.36:7893
      NO_PROXY: localhost,127.0.0.1,192.168.5.0/24
    commands:
      - if [ -f .ci-skip ]; then echo "skip setup (already verified)"; exit 0; fi
      - java -version
      - apt-get update -qq && apt-get install -y -qq unzip curl >/dev/null 2>&1
      - echo "java ready"

  setup-android-sdk:
    image: eclipse-temurin:17-jdk
    environment:
      HTTP_PROXY: http://192.168.5.36:7893
      HTTPS_PROXY: http://192.168.5.36:7893
      NO_PROXY: localhost,127.0.0.1,192.168.5.0/24
      ANDROID_HOME: /opt/android-sdk
      ANDROID_SDK_ROOT: /opt/android-sdk
    volumes:
      - /volume1/docker/dsh-mobile/ci-cache/android-sdk:/opt/android-sdk
    commands:
      - if [ -f .ci-skip ]; then echo "skip sdk (already verified)"; exit 0; fi
      - sh scripts/ci/setup-android-sdk.sh

  unit-tests:
    image: eclipse-temurin:17-jdk
    environment:
      HTTP_PROXY: http://192.168.5.36:7893
      HTTPS_PROXY: http://192.168.5.36:7893
      NO_PROXY: localhost,127.0.0.1,192.168.5.0/24
      ANDROID_HOME: /opt/android-sdk
      ANDROID_SDK_ROOT: /opt/android-sdk
      GRADLE_USER_HOME: /root/.gradle
      JAVA_TOOL_OPTIONS: "-Dhttp.proxyHost=192.168.5.36 -Dhttp.proxyPort=7893 -Dhttps.proxyHost=192.168.5.36 -Dhttps.proxyPort=7893 -Dhttp.nonProxyHosts=192.168.5.*|127.0.0.1|localhost"
    volumes:
      - /volume1/docker/dsh-mobile/ci-cache/android-sdk:/opt/android-sdk
      - /volume1/docker/dsh-mobile/ci-cache/gradle:/root/.gradle
    commands:
      - if [ -f .ci-skip ]; then echo "skip tests (already verified)"; exit 0; fi
      - ./gradlew --no-daemon :core:test :mock-harness:test :app:testDebugUnitTest --stacktrace

  lint:
    image: eclipse-temurin:17-jdk
    environment:
      HTTP_PROXY: http://192.168.5.36:7893
      HTTPS_PROXY: http://192.168.5.36:7893
      NO_PROXY: localhost,127.0.0.1,192.168.5.0/24
      ANDROID_HOME: /opt/android-sdk
      ANDROID_SDK_ROOT: /opt/android-sdk
      GRADLE_USER_HOME: /root/.gradle
      JAVA_TOOL_OPTIONS: "-Dhttp.proxyHost=192.168.5.36 -Dhttp.proxyPort=7893 -Dhttps.proxyHost=192.168.5.36 -Dhttps.proxyPort=7893 -Dhttp.nonProxyHosts=192.168.5.*|127.0.0.1|localhost"
    volumes:
      - /volume1/docker/dsh-mobile/ci-cache/android-sdk:/opt/android-sdk
      - /volume1/docker/dsh-mobile/ci-cache/gradle:/root/.gradle
    commands:
      - if [ -f .ci-skip ]; then echo "skip lint (already verified)"; exit 0; fi
      - ./gradlew --no-daemon :app:lintDebug --stacktrace

  assemble:
    image: eclipse-temurin:17-jdk
    environment:
      HTTP_PROXY: http://192.168.5.36:7893
      HTTPS_PROXY: http://192.168.5.36:7893
      NO_PROXY: localhost,127.0.0.1,192.168.5.0/24
      ANDROID_HOME: /opt/android-sdk
      ANDROID_SDK_ROOT: /opt/android-sdk
      GRADLE_USER_HOME: /root/.gradle
      JAVA_TOOL_OPTIONS: "-Dhttp.proxyHost=192.168.5.36 -Dhttp.proxyPort=7893 -Dhttps.proxyHost=192.168.5.36 -Dhttps.proxyPort=7893 -Dhttp.nonProxyHosts=192.168.5.*|127.0.0.1|localhost"
    volumes:
      - /volume1/docker/dsh-mobile/ci-cache/android-sdk:/opt/android-sdk
      - /volume1/docker/dsh-mobile/ci-cache/gradle:/root/.gradle
    commands:
      - if [ -f .ci-skip ]; then echo "skip assemble (already verified)"; exit 0; fi
      - export DSH_BUILD_REVISION="$CI_COMMIT_SHA"
      - ./gradlew --no-daemon :app:assembleDebug --stacktrace
      - export DSH_BUILD_REVISION="$CI_COMMIT_SHA"
      - ./gradlew --no-daemon :app:assembleRelease --stacktrace
      - ls -la app/build/outputs/apk/debug app/build/outputs/apk/release

  publish-artifact:
    image: alpine:3.20
    volumes:
      - /volume1:/volume1
    commands:
      - if [ -f .ci-skip ]; then echo "skip publish (already verified)"; exit 0; fi
      - sh scripts/ci/publish-artifact.sh

