name: Release APK

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing keystore
        if: ${{ secrets.RELEASE_KEYSTORE != '' }}
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build release APK (signed)
        if: ${{ secrets.RELEASE_KEYSTORE != '' }}
        env:
          DSH_KEYSTORE: ${{ runner.temp }}/release.keystore
          DSH_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          DSH_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          DSH_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Build release APK (unsigned)
        if: ${{ secrets.RELEASE_KEYSTORE == '' }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Checksums
        run: |
          cd app/build/outputs/apk/release
          sha256sum *.apk > SHA256SUMS.txt
          ls -la

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/SHA256SUMS.txt
          generate_release_notes: true
